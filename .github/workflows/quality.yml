name: FRAME quality
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Install browser test tools
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0
      - run: npx playwright install --with-deps chromium webkit
      - name: Real image browser acceptance
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frame-quality-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
