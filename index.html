<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070708"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="FRAME"><link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=3"><link rel="apple-touch-icon-precomposed" sizes="180x180" href="./apple-touch-icon-precomposed.png?v=3"><link rel="icon" type="image/png" href="./apple-touch-icon.png?v=3"><link rel="manifest" href="./manifest.webmanifest?v=3"><title>FRAME</title><style>html,body{margin:0;background:#070708;color:#f4f4f6;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;height:100%}.boot{height:100%;display:grid;place-items:center}.boot div{text-align:center}.dot{width:42px;height:42px;border-radius:50%;border:1px solid #333;border-top:2px solid #ff2bd6;margin:0 auto 14px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{color:#777}</style></head><body><div class="boot"><div><div class="dot"></div><b>FRAME</b><br><small>Cargando…</small></div></div><script>(async()=>{try{const parts=[];for(let i=0;i<8;i++){const r=await fetch(`./frame/director/${i}.txt?v=8`);if(!r.ok)throw new Error('director chunk '+i);parts.push((await r.text()).trim())}const b64=parts.join('');const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);let html=new TextDecoder('utf-8').decode(bytes);html=html.replace(/<title>[\s\S]*?<\/title>/i,'<title>FRAME</title>');const appMeta='<meta name="theme-color" content="#070708"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="FRAME"><link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=3"><link rel="apple-touch-icon-precomposed" sizes="180x180" href="./apple-touch-icon-precomposed.png?v=3"><link rel="manifest" href="./manifest.webmanifest?v=3">';html=html.replace('</head>',appMeta+'</head>');html=html.replace('</body>','<script src="./frame/director-enhancements.js?v=9"><\/script><script src="./frame/interaction-v1.js?v=10"><\/script><script src="./frame/speed-v1.js?v=29"><\/script><script src="./frame/ux-rescue-v1.js?v=14"><\/script><script src="./frame/storyboard-v1.js?v=27"><\/script><script src="./frame/photo-editor-v2.js?v=19"><\/script></body>');document.open();document.write(html);document.close();setTimeout(()=>{document.title='FRAME'},50)}catch(e){document.body.innerHTML='<div class="boot"><div><b>No pude cargar FRAME</b><br><small>'+e.message+'</small></div></div>'}})();</script></body></html>
